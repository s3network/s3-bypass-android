name: Build APK

# Assembles the app against a pinned release of our core.
#
# The AAR is downloaded, not built. Two reasons: a 100 MB artifact in git
# history can never be slimmed and every clone pays for it, and Gradle
# globs every *.aar in app/libs — so a committed copy would silently ship
# whichever core was stale. Building it here instead would cost ~8 minutes
# of NDK work per run to produce the same bytes as the tagged release.
#
# It is still verified, not trusted. verify-aar.sh is the same script the
# core's own CI runs: it checks the core marker, the three classes the app
# resolves by reflection, and the method signatures. That last part is the
# only automated check in this chain for something reflection resolves at
# runtime — a mismatched signature compiles cleanly and fails on connect.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: assemble debug APK
    runs-on: ubuntu-latest
    env:
      # A tag of s3-bypass-android-core, not of s3-bypass-protocol. Bumping
      # it is what ships a new core to every build.
      CORE_RELEASE: v0.1.0-android.1

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package no longer exists upstream.
          packages: 'cmdline-tools;latest'

      - name: Install platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Fetch the core
        run: |
          git clone --quiet --depth 1 \
            --branch "$CORE_RELEASE" \
            https://github.com/thevladimirzh/s3-bypass-android-core.git /tmp/core
          # app/libs holds no committed files — the AAR is the only thing that
          # ever lived there, and it is gitignored — so the directory does not
          # exist in a fresh checkout and curl cannot write into it.
          mkdir -p app/libs
          curl -fsSL -o app/libs/libxray.aar \
            "https://github.com/thevladimirzh/s3-bypass-android-core/releases/download/${CORE_RELEASE}/libxray.aar"
          ls -la app/libs/

      - name: Verify the core
        run: /tmp/core/scripts/verify-aar.sh app/libs/libxray.aar

      - name: Assemble
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: s3-bypass-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
