name: Build APK

# Assembles the app against a pinned release of our core.
#
# The AAR is downloaded, not built. Two reasons: a 100 MB artifact in git
# history can never be slimmed and every clone pays for it, and Gradle
# globs every *.aar in app/libs — so a committed copy would silently ship
# whichever core was stale. Building it here instead would cost ~8 minutes
# of NDK work per run to produce the same bytes as the tagged release.
#
# It is still verified, not trusted. verify-aar.sh is the same script the
# core's own CI runs: it checks the core marker, the three classes the app
# resolves by reflection, and the method signatures. That last part is the
# only automated check in this chain for something reflection resolves at
# runtime — a mismatched signature compiles cleanly and fails on connect.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: assemble release APK
    runs-on: ubuntu-latest
    env:
      # A tag of the core release attached to this repository. Bumping
      # it is what ships a new core to every build.
      CORE_RELEASE: v0.1.0-android.2

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package no longer exists upstream.
          packages: 'cmdline-tools;latest'

      - name: Install platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Fetch the core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Downloaded from this repository's own release rather than from
          # s3-bypass-android-core: while that one is private, an unauthenticated
          # download 404s, and the default GITHUB_TOKEN cannot read another
          # repository even when both belong to us. Owning the copy here keeps
          # the build working without a personal access token as a secret.
          mkdir -p app/libs
          gh release download "$CORE_RELEASE" \
            --repo s3network/s3-bypass-android \
            --pattern libxray.aar \
            --dir app/libs
          ls -la app/libs/

      - name: Verify the core
        run: scripts/verify-aar.sh app/libs/libxray.aar

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # A debug-signed APK can be installed but never upgraded: the next
          # release signed with a real key is a different application to the
          # system, so it has to be uninstalled first, losing its data. The
          # key comes from secrets and is written where build.gradle expects
          # it, never committed.
          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.jks"
          cat > app/keystore.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$HOME/release.jks
          PROPS
          keytool -list -keystore "$HOME/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null \
            || { echo "keystore is unreadable with the stored password" >&2; exit 1; }

      - name: Assemble
        run: |
          # Gradle is installed from the distribution instead of a wrapper:
          # the repository ships gradle-wrapper.properties but no gradlew and
          # no gradle-wrapper.jar, so there is nothing to run. The version
          # below is read from that file rather than repeated, so the two
          # cannot drift.
          GRADLE_VERSION="$(sed -n 's|.*gradle-\(.*\)-bin\.zip.*|\1|p' gradle/wrapper/gradle-wrapper.properties)"
          echo "Gradle $GRADLE_VERSION"
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d /opt
          chmod +x "/opt/gradle-${GRADLE_VERSION}/bin/gradle"
          # assembleRelease, not assembleDebug. The release build is the only
          # one that reads app/keystore.properties, so the debug variant would
          # quietly produce an APK signed with the shared debug key again —
          # and that one cannot be upgraded over later.
          "/opt/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon assembleRelease

      - name: Verify the signature
        run: |
          # Assert the artifact is signed by the release key and not the
          # debug one. A misconfigured build would otherwise look identical
          # in the artifact list and be undiagnosable once it reached a phone.
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          for APK in app/build/outputs/apk/release/*.apk; do
            echo "== $APK"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate DN|SHA-256"
          done
          if "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk \
             | grep -q "CN=Android Debug"; then
            echo "release build is signed with the debug key" >&2
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: s3-bypass-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
