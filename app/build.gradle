plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.darkbit.bypass'
    compileSdk 35

    defaultConfig {
        applicationId "com.s3network.bypass"
        minSdk 21
        targetSdk 35
        versionCode 18
        versionName "1.2.0"
    }

    // Release signing is read from keystore.properties, which is never
    // committed. Without it the release build stays unsigned rather than
    // failing, so a missing key cannot silently produce an APK that can
    // never be updated afterwards.
    signingConfigs {
        if (file('keystore.properties').exists()) {
            def props = new Properties()
            props.load(new FileInputStream(file('keystore.properties')))
            release {
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // For the version comparison, which is the one piece of the updater that
    // can fail silently: a wrong answer means "up to date" forever, with
    // nothing on screen to say otherwise.
    testImplementation 'junit:junit:4.13.2'
    // The real org.json, for the same reason. Unit tests run against android.jar,
    // where org.json is a stub whose every method throws "not mocked" — so the
    // release-selection cases could not parse a single body. `returnDefaultValues`
    // is the tempting alternative and is useless here: it would hand back null
    // and 0, and the parser under test would then be tested against nothing.
    // This is test scope only; the APK keeps Android's own implementation.
    testImplementation 'org.json:json:20231013'
    implementation 'com.github.mwiede:jsch:0.2.20'
}
