plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.darkbit.bypass'
    compileSdk 35

    defaultConfig {
        applicationId "com.s3network.bypass"
        minSdk 21
        targetSdk 35
        versionCode 15
        versionName "1.1.1"
    }

    // Release signing is read from keystore.properties, which is never
    // committed. Without it the release build stays unsigned rather than
    // failing, so a missing key cannot silently produce an APK that can
    // never be updated afterwards.
    signingConfigs {
        if (file('keystore.properties').exists()) {
            def props = new Properties()
            props.load(new FileInputStream(file('keystore.properties')))
            release {
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.github.mwiede:jsch:0.2.20'
}
